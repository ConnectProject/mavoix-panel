<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="app-logo-128x128.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
    <script>
      // Reloading a tab (or coming back to /home): paint the colour of the last tab at once instead of white.
      // HomeLayout removes this style when the app is up and the pages paint their own background.
      try {
        var lastTabColor = window.localStorage.getItem('mavoix.lastTabColor')
        if (lastTabColor && /^#[0-9a-f]{3,8}$/i.test(lastTabColor) && /^\/(tabs\/|home)/.test(window.location.pathname)) {
          document.write('<style id="boot-background">html, body { background: ' + lastTabColor + ' !important }</style>')
        }
      } catch (e) { /* no storage: keep the default background */ }
    </script>
  </head>
  <body>
    <!-- DO NOT touch the following DIV -->
    <div id="q-app"></div>
  </body>
</html>
